---
layout: layout.html
title: Blog
eleventyExcludeFromCollections: true
---

<h1>Blog</h1>

{% for post in collections.blog %}
<a class="card prose" href="{{ post.url }}">
  <div class="row space-between">
    <div class="ch-3">{{ post.data.title }}</div>
    <div>{{ post.data.date | date: '%b, %Y'}}</div>
  </div>
  <p class="ch-s">{{ post.data.brief }}</p>
</a>
{% endfor %}
