<h1>404</h1>
<pre><code><span id="ears">(\(\ </span>
<span id="face">(-.-)</span>
(_(")(")
</code></pre>

<style>
    pre {
        font-size: 2rem;
        display: block;
        margin-inline: auto;
        margin-block-start: 4rem;
        padding: var(--spacing);
        aspect-ratio: 1 / 1;
        align-content: center;
    }
</style>

<script>
function anim(target, frames, i = 0) {
    let [text, duration] = frames[i];
    if (typeof duration === 'function') duration = duration();
    target.textContent = frames[i][0];
    setTimeout(anim, duration, target, frames, (i + 1) % frames.length);
}
function start() {
    anim(document.getElementById("face"), [
        ["(−.−)", 1500], 
        ["(-.-)", 1500]
    ]);
    anim(document.getElementById("ears"), [
        ["(\\(\\ ", () => Math.random() * 8000],
        ["(\\ (|", 24],
        ["(\\ /)", 84],
        ["(\\|) ", 24],  
    ]);
}
if (document.readyState == "complete") start();
else window.addEventListener('load', start);
</script>
