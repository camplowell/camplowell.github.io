<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />
        <link rel="icon" href="{{ '/logo.svg' | url}}" />
        <title>{{ title | default: "Untitled" }} | Lowell Camp</title>
        <link
            rel="preload"
            href="/fonts/diphylleia-ascii.woff2"
            as="font"
            type="font/woff2"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="{{ '/css/app.css' | url }}" />
        <style>{% getBundle "css" %}</style>
        <script>{% getBundle "js" %}</script>
    </head>

        <nav>
            <a class="logo row" href="{{ '/' | url }}" style="width: fit-content">
                <img src="{{ '/logo.svg' | url }}" width="64" height="64"/>
                <span>Lowell Camp</span>
            </a>
            <div class="categories row no-gap">
                <a href="{{ '/' | url }}">About</a>
                <a href="{{ '/blog' | url }}">Blog</a>
                <a href="{{ '/resume' | url }}">Resume</a>

        </nav>
